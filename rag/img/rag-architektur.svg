<svg viewBox="0 0 930 305" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RAG-Architektur: Beim einmaligen Indexieren werden PDF-Dokumente in Chunks aufgeteilt, per Embedding-Modell in Vektoren umgewandelt und in Chroma gespeichert. Bei jeder Anfrage wird die Nutzerfrage genauso eingebettet, Chroma liefert die aehnlichsten Chunks als Kontext, und das LLM generiert daraus die Antwort.">
  <defs>
    <marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="930" height="305" fill="#ffffff"/>

  <text x="20" y="25" font-size="13" font-weight="bold" fill="#64748b">Indexierung (einmalig, vor der ersten Anfrage)</text>

  <rect x="20" y="40" width="140" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="74" text-anchor="middle" font-size="12" fill="#1e293b">PDF-Dokumente</text>

  <rect x="190" y="40" width="160" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="74" text-anchor="middle" font-size="12" fill="#1e293b">In Chunks aufteilen</text>

  <rect x="380" y="40" width="200" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="480" y="66" text-anchor="middle" font-size="12" fill="#1e293b">Embedding-Modell</text>
  <text x="480" y="82" text-anchor="middle" font-size="12" fill="#1e293b">(nomic-embed-text)</text>

  <rect x="610" y="40" width="180" height="60" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="2"/>
  <text x="700" y="74" text-anchor="middle" font-size="12" fill="#0f766e">In Chroma speichern</text>

  <line x1="160" y1="70" x2="185" y2="70" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="350" y1="70" x2="375" y2="70" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="580" y1="70" x2="605" y2="70" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <text x="20" y="210" font-size="13" font-weight="bold" fill="#64748b">Anfrage (bei jeder Frage)</text>

  <rect x="20" y="225" width="140" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="259" text-anchor="middle" font-size="12" fill="#1e293b">Nutzerfrage</text>

  <rect x="190" y="225" width="160" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="259" text-anchor="middle" font-size="12" fill="#1e293b">Embedding-Modell</text>

  <rect x="380" y="225" width="200" height="60" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="2"/>
  <text x="480" y="251" text-anchor="middle" font-size="12" fill="#0f766e">Chroma: Vektorsuche</text>
  <text x="480" y="267" text-anchor="middle" font-size="12" fill="#0f766e">(Top-k aehnlichste Chunks)</text>

  <rect x="610" y="225" width="260" height="60" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="740" y="251" text-anchor="middle" font-size="12" fill="#1e293b">Prompt = Frage + Kontext</text>
  <text x="740" y="267" text-anchor="middle" font-size="12" fill="#1e293b">→ LLM generiert Antwort</text>

  <line x1="160" y1="255" x2="185" y2="255" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="350" y1="255" x2="375" y2="255" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowG)"/>
  <line x1="580" y1="255" x2="605" y2="255" stroke="#334155" stroke-width="1.5" marker-end="url(#arrowG)"/>

  <!-- connector: same Chroma store -->
  <path d="M700,100 L700,160 L480,160 L480,220" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrowG)"/>
  <text x="590" y="155" text-anchor="middle" font-size="11" fill="#0f766e">gleiche Chroma-Datenbank</text>
</svg>
