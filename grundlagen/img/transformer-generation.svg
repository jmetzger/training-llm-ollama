<svg viewBox="0 0 960 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Text wird tokenisiert, in Embeddings umgewandelt, per Self-Attention gewichtet und Token fuer Token autoregressiv fortgesetzt.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="440" fill="#ffffff"/>

  <!-- Top row: 4 stages -->
  <rect x="20" y="30" width="170" height="70" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="105" y="58" text-anchor="middle" font-size="13" fill="#1e293b">Text in</text>
  <text x="105" y="76" text-anchor="middle" font-size="13" fill="#1e293b">Tokens zerlegen</text>

  <rect x="230" y="30" width="170" height="70" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="315" y="58" text-anchor="middle" font-size="13" fill="#1e293b">Tokens →</text>
  <text x="315" y="76" text-anchor="middle" font-size="13" fill="#1e293b">Embeddings (Vektoren)</text>

  <rect x="440" y="30" width="220" height="70" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="2"/>
  <text x="550" y="52" text-anchor="middle" font-size="13" fill="#0f766e" font-weight="bold">Self-Attention:</text>
  <text x="550" y="70" text-anchor="middle" font-size="13" fill="#0f766e">jedes Token gewichtet</text>
  <text x="550" y="88" text-anchor="middle" font-size="13" fill="#0f766e">alle vorherigen Tokens</text>

  <rect x="700" y="30" width="240" height="70" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="820" y="58" text-anchor="middle" font-size="13" fill="#1e293b">Wahrscheinlichstes</text>
  <text x="820" y="76" text-anchor="middle" font-size="13" fill="#1e293b">naechstes Token waehlen</text>

  <!-- Arrows between stages -->
  <line x1="195" y1="65" x2="225" y2="65" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="405" y1="65" x2="435" y2="65" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="665" y1="65" x2="695" y2="65" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Connector down to attention illustration -->
  <line x1="550" y1="100" x2="550" y2="148" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="550" y="172" text-anchor="middle" font-size="13" font-style="italic" fill="#475569">Beispiel: Self-Attention fuer das Token gut</text>

  <!-- Attention arcs (drawn behind nodes) -->
  <path d="M660,290 Q620,258 580,290" fill="none" stroke="#0f766e" stroke-width="5" opacity="0.9"/>
  <path d="M660,290 Q580,228 500,290" fill="none" stroke="#0f766e" stroke-width="3" opacity="0.6"/>
  <path d="M660,290 Q540,196 420,290" fill="none" stroke="#0f766e" stroke-width="1.5" opacity="0.35"/>

  <text x="795" y="260" text-anchor="end" font-size="11" fill="#0f766e">hohe Aufmerksamkeit</text>
  <text x="795" y="200" text-anchor="end" font-size="11" fill="#0f766e" opacity="0.7">geringe Aufmerksamkeit</text>

  <!-- Token nodes -->
  <circle cx="420" cy="290" r="9" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <circle cx="500" cy="290" r="9" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <circle cx="580" cy="290" r="9" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <circle cx="660" cy="290" r="9" fill="#0f766e" stroke="#0f766e" stroke-width="1.5"/>

  <text x="420" y="318" text-anchor="middle" font-size="12" fill="#1e293b">Ollama</text>
  <text x="500" y="318" text-anchor="middle" font-size="12" fill="#1e293b">ist</text>
  <text x="580" y="318" text-anchor="middle" font-size="12" fill="#1e293b">wirklich</text>
  <text x="660" y="318" text-anchor="middle" font-size="12" fill="#0f766e" font-weight="bold">gut</text>

  <!-- Loop back: autoregressive continuation -->
  <path d="M820,100 L820,400 L105,400 L105,100" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="462" y="418" text-anchor="middle" font-size="12" fill="#475569">Token wird angehaengt — Schritt wiederholt sich (autoregressiv)</text>
</svg>
