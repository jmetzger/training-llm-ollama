<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vergleich: Bei lokalem Ollama-Betrieb bleibt der gesamte Prompt- und Antwortverkehr innerhalb der Firmennetz-Grenze. Bei einer Cloud-API verlaesst der Prompt das Firmennetz und geht ggf. in ein Drittland.">
  <defs>
    <marker id="arrowL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>

  <!-- Firmennetz-Grenze -->
  <line x1="500" y1="20" x2="500" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="500" y="12" text-anchor="middle" font-size="11" fill="#64748b">Firmennetz-Grenze</text>

  <!-- Lane 1: Lokal -->
  <text x="60" y="45" font-size="14" font-weight="bold" fill="#0f766e">Lokal: Ollama in der eigenen Infrastruktur</text>

  <rect x="60" y="60" width="150" height="55" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="135" y="92" text-anchor="middle" font-size="12" fill="#1e293b">Nutzer / Anwendung</text>

  <rect x="290" y="60" width="190" height="55" rx="8" fill="#e6f2f0" stroke="#0f766e" stroke-width="2"/>
  <text x="385" y="84" text-anchor="middle" font-size="12" fill="#0f766e">Ollama + Modell</text>
  <text x="385" y="100" text-anchor="middle" font-size="12" fill="#0f766e">(eigene VM)</text>

  <line x1="210" y1="78" x2="285" y2="78" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="247" y="70" text-anchor="middle" font-size="11" fill="#0f766e">Prompt</text>

  <line x1="285" y1="100" x2="210" y2="100" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrowL)"/>
  <text x="247" y="115" text-anchor="middle" font-size="11" fill="#0f766e">Antwort</text>

  <!-- Lane 2: Cloud -->
  <text x="60" y="185" font-size="14" font-weight="bold" fill="#b91c1c">Cloud: externe API</text>

  <rect x="60" y="200" width="150" height="55" rx="8" fill="#eef2f7" stroke="#334155" stroke-width="1.5"/>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#1e293b">Nutzer / Anwendung</text>

  <rect x="600" y="200" width="240" height="55" rx="8" fill="#fdeaea" stroke="#b91c1c" stroke-width="2"/>
  <text x="720" y="222" text-anchor="middle" font-size="12" fill="#b91c1c">Cloud-API-Anbieter</text>
  <text x="720" y="238" text-anchor="middle" font-size="12" fill="#b91c1c">(ggf. Drittland, z.B. USA)</text>

  <line x1="210" y1="218" x2="595" y2="218" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowC)"/>
  <text x="350" y="210" text-anchor="middle" font-size="11" fill="#b91c1c">Prompt verlaesst Firmennetz</text>

  <line x1="595" y1="245" x2="210" y2="245" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrowC)"/>
  <text x="350" y="262" text-anchor="middle" font-size="11" fill="#b91c1c">Antwort (ggf. Drittlandtransfer)</text>
</svg>
