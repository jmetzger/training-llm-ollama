<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Balkendiagramm: VRAM-Bedarf verschiedener Ollama-Modelle im Vergleich zu 6 GB (dieses Notebook) und 16 GB (Trainings-VM). granite4.1 3b, llama3.2, lfm2.5 8b und granite4.1 8b sind gemessen und passen auf dieses Notebook. gpt-oss 20b passt nur auf die 16-GB-Trainings-VM. qwen3.6 27b passt auf keine der beiden.">
  <rect x="0" y="0" width="900" height="400" fill="#ffffff"/>

  <text x="160" y="16" font-size="11" fill="#64748b">durchgezogen = gemessen (dieses Notebook) · gestrichelt = Downloadgroesse, ungetestet</text>

  <!-- threshold lines -->
  <line x1="368" y1="25" x2="368" y2="335" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="368" y="350" text-anchor="middle" font-size="12" fill="#334155">6 GB</text>
  <text x="368" y="365" text-anchor="middle" font-size="11" fill="#64748b">dieses Notebook</text>

  <line x1="715" y1="25" x2="715" y2="335" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="715" y="350" text-anchor="middle" font-size="12" fill="#334155">16 GB</text>
  <text x="715" y="365" text-anchor="middle" font-size="11" fill="#64748b">Trainings-VM</text>

  <!-- bars: measured, fit on this notebook (teal) -->
  <text x="150" y="59" text-anchor="end" font-size="13" fill="#1e293b">granite4.1:3b</text>
  <rect x="160" y="41" width="87" height="28" fill="#0f766e"/>
  <text x="255" y="59" font-size="12" fill="#334155">2,5 GB</text>

  <text x="150" y="109" text-anchor="end" font-size="13" fill="#1e293b">llama3.2</text>
  <rect x="160" y="91" width="90" height="28" fill="#0f766e"/>
  <text x="258" y="109" font-size="12" fill="#334155">2,6 GB</text>

  <text x="150" y="159" text-anchor="end" font-size="13" fill="#1e293b">lfm2.5:8b</text>
  <rect x="160" y="141" width="187" height="28" fill="#0f766e"/>
  <text x="355" y="159" font-size="12" fill="#334155">5,4 GB</text>

  <text x="150" y="209" text-anchor="end" font-size="13" fill="#1e293b">granite4.1:8b</text>
  <rect x="160" y="191" width="215" height="28" fill="#0f766e"/>
  <text x="383" y="209" font-size="12" fill="#334155">6,2 GB</text>

  <!-- bars: untested, dashed outline -->
  <text x="150" y="259" text-anchor="end" font-size="13" fill="#1e293b">gpt-oss:20b</text>
  <rect x="160" y="241" width="486" height="28" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="654" y="259" font-size="12" fill="#b45309">~14 GB (Download)</text>

  <text x="150" y="309" text-anchor="end" font-size="13" fill="#1e293b">qwen3.6:27b</text>
  <rect x="160" y="291" width="590" height="28" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="758" y="309" font-size="12" fill="#b91c1c">17 GB (Download)</text>
</svg>
